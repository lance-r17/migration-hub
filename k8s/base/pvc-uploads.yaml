apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-pvc
  namespace: migration-hub
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  # Adjust storageClassName to your cluster's RWX-capable class
  # (e.g., nfs-client, efs-sc, azurefile-premium)
  # storageClassName: ""
