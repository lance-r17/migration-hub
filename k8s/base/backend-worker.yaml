apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-worker
  namespace: migration-hub
  labels:
    app.kubernetes.io/name: backend-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-worker
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: migration-hub-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: migration-hub-config
            - secretRef:
                name: migration-hub-secrets
          env:
            # Worker pods run background tasks (default is false in ConfigMap,
            # we override explicitly here for clarity)
            - name: DISABLE_BACKGROUND_TASKS
              value: "false"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: migration-hub-secrets
                  key: DATABASE_URL
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend-worker
  namespace: migration-hub
  labels:
    app.kubernetes.io/name: backend-worker
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      name: http
  selector:
    app.kubernetes.io/name: backend-worker
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-worker
  namespace: migration-hub
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-worker
