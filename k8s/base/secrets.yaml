apiVersion: v1
kind: Secret
metadata:
  name: migration-hub-secrets
  namespace: migration-hub
type: Opaque
stringData:
  # --- Database ---
  # Format: postgresql+asyncpg://user:password@postgres:5432/migration_hub
  DATABASE_URL: "postgresql+asyncpg://hub:CHANGE_ME@postgres:5432/migration_hub"
  DB_PASSWORD: "CHANGE_ME"

  # --- Jira ---
  JIRA_BASE_URL: "https://your-org.atlassian.net"
  JIRA_API_TOKEN: "CHANGE_ME"
  JIRA_USER_EMAIL: "CHANGE_ME@example.com"
  JIRA_SUBTASK_ISSUE_TYPE_ID: ""
  JIRA_ISSUE_LINK_TYPE: "Delivers"

  # --- OAuth / OIDC (choose one flow) ---
  # Custom OAuth:
  OAUTH_SERVICE_URL: ""
  OAUTH_CLIENT_ID: "migration-hub"
  OAUTH_CLIENT_SECRET: "CHANGE_ME"
  SESSION_SECRET_KEY: "CHANGE_ME"
  OAUTH_ROLE_MAPPINGS: ""

  # Standard OIDC (legacy):
  OIDC_ISSUER: ""
  OIDC_AUDIENCE: "migration-hub"

  # --- Frontend secrets (mirror of above for the Go entrypoint) ---
  API_BASE_URL: "https://migration-hub.example.com/api"
  EMAIL_SERVER_URL: ""
  OAUTH_CLIENT_ID: "migration-hub"
  OAUTH_REDIRECT_URI: "https://migration-hub.example.com/callback"
  OIDC_CLIENT_ID: "migration-hub"
  OIDC_REDIRECT_URI: "https://migration-hub.example.com/callback"
