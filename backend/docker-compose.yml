services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: migration_hub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub_dev_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hub"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://hub:hub_dev_secret@db/migration_hub
      CORS_ORIGINS: http://localhost:5173
      CURRENT_USER_ID: u-current
      ENVIRONMENT: development
      # Uncomment ONE auth mode:
      # --- Custom OAuth (recommended for new projects) ---
      # OAUTH_SERVICE_URL: http://mock-oauth:5557
      # OAUTH_CLIENT_ID: migration-hub
      # OAUTH_CLIENT_SECRET: mock-secret
      # SESSION_SECRET_KEY: dev-secret-change-me
      # SESSION_MAX_AGE_MINUTES: 480
      # --- Standard OIDC (legacy) ---
      OIDC_ISSUER: http://dex:5556/dex
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  dex:
    image: dexidp/dex:latest
    command: dex serve /etc/dex/config.yaml
    volumes:
      - ../mock-oidc/config.yaml:/etc/dex/config.yaml:ro
      - dex_data:/var/dex
    ports:
      - "5556:5556"
    restart: unless-stopped

  mock-oauth:
    build: ../mock-oauth
    ports:
      - "5557:5557"
    environment:
      MOCK_OAUTH_CLIENT_ID: migration-hub
      MOCK_OAUTH_CLIENT_SECRET: mock-secret-do-not-use-in-production
      MOCK_OAUTH_PORT: 5557
    restart: unless-stopped

  pgweb:
    image: sosedoff/pgweb
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=postgres://hub:hub_dev_secret@db/migration_hub?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  dex_data:
