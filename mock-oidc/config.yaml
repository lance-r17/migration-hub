# dex OIDC provider configuration for local development
# Simulates Azure AD enterprise SSO until real OIDC is ready.
#
# SECURITY NOTICE:
# The bcrypt hash below is a PUBLICLY KNOWN dev-only hash shared across all
# mock users. It exists ONLY for local development convenience and must NEVER
# be used in any staging or production environment. The corresponding plaintext
# password is intentionally not documented here; generate a new hash with
# `python -c "import bcrypt; print(bcrypt.hashpw(b'<pw>', bcrypt.gensalt()).decode())"`
# if you need a different local password.
#
# Mock users:
#   henry.wilson@corp.com  — Henry Wilson (Platform Migration Lead)
#   alice.johnson@corp.com — Alice Johnson (Technical Lead)
#   karen.lee@corp.com     — Karen Lee (Business Owner)
#   dan.brown@corp.com     — Dan Brown (viewer)

issuer: http://localhost:5556/dex

storage:
  type: sqlite3
  config:
    file: /var/dex/dex.db

web:
  http: 0.0.0.0:5556
  allowedOrigins:
    - http://localhost:5173

oauth2:
  skipApprovalScreen: true
  responseTypes:
    - code

staticClients:
  - id: migration-hub
    public: true
    name: Migration Hub
    redirectURIs:
      - http://localhost:5173/callback

enablePasswordDB: true

staticPasswords:
